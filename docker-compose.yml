services:

  backend:
    build: ./backend-todo
    ports: 
      - "4000:4000"

    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=${PORT}

  frontend:
    build: ./frontend-todo
    ports:
      - 3000:3000
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    depends_on:
      - backend